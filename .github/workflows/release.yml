name: Release

# Bei einem Tag v* wird die Fassung ins TER (extensions.typo3.org) hochgeladen. Packagist holt sich den Tag
# selbst (GitHub-Hook des Pakets). Das Secret TYPO3_API_TOKEN liegt im Environment `ter` (nur für Tags v*, mit
# Freigabe durch die Betreiberin); ohne es bricht der Lauf ab, bevor etwas hochgeladen wird.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  ter:
    name: Ins TER hochladen
    runs-on: ubuntu-latest
    environment: ter
    steps:
      - name: Secret prüfen
        env:
          TYPO3_API_TOKEN: ${{ secrets.TYPO3_API_TOKEN }}
        run: |
          if [ -z "$TYPO3_API_TOKEN" ]; then
            echo "::error::Das Secret TYPO3_API_TOKEN fehlt (Repository > Settings > Environments > ter). Es wurde nichts hochgeladen."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - name: Tailor installieren
        run: composer global require 'typo3/tailor:^2.1' --prefer-dist --no-progress
      - name: Version aus dem Tag und ext_emconf.php
        id: version
        run: |
          fassung="${GITHUB_REF_NAME#v}"
          if ! echo "$fassung" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Der Tag $GITHUB_REF_NAME ist keine Fassung der Form vX.Y.Z."
            exit 1
          fi
          emconf=$(php -r '$_EXTKEY="barrierepruefung"; require "ext_emconf.php"; echo $EM_CONF[$_EXTKEY]["version"];')
          if [ "$emconf" != "$fassung" ]; then
            echo "::error::ext_emconf.php nennt die Version $emconf, der Tag aber $fassung. Es wurde nichts hochgeladen."
            exit 1
          fi
          echo "fassung=$fassung" >> "$GITHUB_OUTPUT"
      - name: Beschreibung aus dem CHANGELOG
        id: kommentar
        env:
          FASSUNG: ${{ steps.version.outputs.fassung }}
        run: |
          # Abschnitt der Fassung aus CHANGELOG.md (TER-Kommentar); fehlt er, bricht der Lauf ab.
          kopf=$(grep -E "^## ${FASSUNG//./\\.}( |$)" CHANGELOG.md || true)
          if grep -qi 'unveröffentlicht' <<<"$kopf"; then
            echo "::error::Der Abschnittskopf in CHANGELOG.md nennt $FASSUNG noch „unveröffentlicht“ (\"$kopf\"). Datum eintragen, committen, Tag neu setzen. Es wurde nichts hochgeladen."
            exit 1
          fi
          abschnitt=$(awk -v v="$FASSUNG" '$0 ~ "^## " v "( |$)" {a=1; next} /^## / {a=0} a' CHANGELOG.md | sed '/^$/N;/^\n$/D' | sed '/./,$!d')
          if [ -z "$abschnitt" ]; then
            echo "::error::CHANGELOG.md hat keinen Abschnitt für $FASSUNG."
            exit 1
          fi
          {
            echo 'text<<EOF_KOMMENTAR'
            echo "$abschnitt"
            echo 'EOF_KOMMENTAR'
          } >> "$GITHUB_OUTPUT"
      - name: Archiv bauen (git archive, .gitattributes entscheidet wie bei Packagist; Tailor packt es für das TER neu)
        env:
          FASSUNG: ${{ steps.version.outputs.fassung }}
        run: |
          # Mit Wurzelordner: Tailor erkennt einen Wurzelordner am ersten Eintrag des Zips und packt flach neu (es
          # nimmt dabei seine eigene Ausschlussliste: u. a. Tests/ fällt weg). Ohne Präfix hinge die Erkennung davon
          # ab, ob der erste Eintrag zufällig ein Verzeichnis ist.
          git archive --format=zip --prefix=barrierepruefung/ -o "$RUNNER_TEMP/barrierepruefung_$FASSUNG.zip" HEAD
          unzip -l "$RUNNER_TEMP/barrierepruefung_$FASSUNG.zip"
      - name: Archivinhalt prüfen
        env:
          FASSUNG: ${{ steps.version.outputs.fassung }}
        run: |
          # Entwicklungsdateien dürfen nicht ins öffentliche TER-Archiv.
          inhalt=$(unzip -Z1 "$RUNNER_TEMP/barrierepruefung_$FASSUNG.zip")
          muster='(^|/)(CLAUDE\.md|\.github/|Build/|Tests/Unit|Tests/Functional|\.php-cs-fixer|phpstan|node_modules/|package(-lock)?\.json)'
          if grep -Ei "$muster" <<<"$inhalt" >/dev/null; then
            echo "::error::Das Archiv enthält Entwicklungsdateien:"
            grep -Ei "$muster" <<<"$inhalt"
            exit 1
          fi
      - name: Ins TER hochladen
        env:
          FASSUNG: ${{ steps.version.outputs.fassung }}
          KOMMENTAR: ${{ steps.kommentar.outputs.text }}
          TYPO3_API_TOKEN: ${{ secrets.TYPO3_API_TOKEN }}
        run: |
          "$(composer global config bin-dir --absolute --quiet)/tailor" ter:publish \
            --artefact "$RUNNER_TEMP/barrierepruefung_$FASSUNG.zip" \
            --comment "$KOMMENTAR" \
            "$FASSUNG" barrierepruefung
