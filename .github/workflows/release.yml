name: Release

# Bei einem Tag v* wird die Fassung ins TER (extensions.typo3.org) hochgeladen. Packagist holt sich den Tag
# selbst (GitHub-Hook des Pakets). Ohne das Secret TYPO3_API_TOKEN bricht der Lauf ab, bevor etwas hochgeladen wird.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  ter:
    name: Ins TER hochladen
    runs-on: ubuntu-latest
    env:
      TYPO3_API_TOKEN: ${{ secrets.TYPO3_API_TOKEN }}
    steps:
      - name: Secret prüfen
        run: |
          if [ -z "$TYPO3_API_TOKEN" ]; then
            echo "::error::Das Secret TYPO3_API_TOKEN fehlt (Repository > Settings > Secrets and variables > Actions). Es wurde nichts hochgeladen."
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Version aus dem Tag und ext_emconf.php
        id: version
        run: |
          fassung="${GITHUB_REF_NAME#v}"
          if ! echo "$fassung" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Der Tag $GITHUB_REF_NAME ist keine Fassung der Form vX.Y.Z."
            exit 1
          fi
          emconf=$(php -r '$_EXTKEY="barrierepruefung"; require "ext_emconf.php"; echo $EM_CONF[$_EXTKEY]["version"];')
          if [ "$emconf" != "$fassung" ]; then
            echo "::error::ext_emconf.php nennt die Version $emconf, der Tag aber $fassung. Es wurde nichts hochgeladen."
            exit 1
          fi
          echo "fassung=$fassung" >> "$GITHUB_OUTPUT"
      - name: Beschreibung aus dem CHANGELOG
        id: kommentar
        env:
          FASSUNG: ${{ steps.version.outputs.fassung }}
        run: |
          # Abschnitt der Fassung aus CHANGELOG.md (TER-Kommentar); fehlt er, bricht der Lauf ab.
          abschnitt=$(awk -v v="$FASSUNG" '$0 ~ "^## " v "( |$)" {a=1; next} /^## / {a=0} a' CHANGELOG.md | sed '/^$/N;/^\n$/D')
          if [ -z "$abschnitt" ]; then
            echo "::error::CHANGELOG.md hat keinen Abschnitt für $FASSUNG."
            exit 1
          fi
          {
            echo 'text<<EOF_KOMMENTAR'
            echo "$abschnitt"
            echo 'EOF_KOMMENTAR'
          } >> "$GITHUB_OUTPUT"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - name: Tailor installieren
        run: composer global require typo3/tailor --prefer-dist --no-progress
      - name: Archiv bauen (git archive, .gitattributes entscheidet wie bei Packagist)
        env:
          FASSUNG: ${{ steps.version.outputs.fassung }}
        run: |
          git archive --format=zip -o "$RUNNER_TEMP/barrierepruefung_$FASSUNG.zip" HEAD
          unzip -l "$RUNNER_TEMP/barrierepruefung_$FASSUNG.zip"
      - name: Archivinhalt prüfen
        env:
          FASSUNG: ${{ steps.version.outputs.fassung }}
        run: |
          # Entwicklungsdateien dürfen nicht ins öffentliche TER-Archiv.
          inhalt=$(unzip -Z1 "$RUNNER_TEMP/barrierepruefung_$FASSUNG.zip")
          if echo "$inhalt" | grep -Eiq '(^|/)(CLAUDE\.md|\.github/|Build/|Tests/Unit|Tests/Functional|\.php-cs-fixer|phpstan|node_modules/|package(-lock)?\.json)'; then
            echo "::error::Das Archiv enthält Entwicklungsdateien:"
            echo "$inhalt" | grep -Ei '(^|/)(CLAUDE\.md|\.github/|Build/|Tests/Unit|Tests/Functional|\.php-cs-fixer|phpstan|node_modules/|package(-lock)?\.json)'
            exit 1
          fi
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - name: Tailor installieren
        run: composer global require typo3/tailor --prefer-dist --no-progress
      - name: Ins TER hochladen
        env:
          FASSUNG: ${{ steps.version.outputs.fassung }}
          KOMMENTAR: ${{ steps.kommentar.outputs.text }}
        run: |
          "$(composer global config bin-dir --absolute --quiet)/tailor" ter:publish \
            --artefact "$RUNNER_TEMP/barrierepruefung_$FASSUNG.zip" \
            --comment "$KOMMENTAR" \
            "$FASSUNG" barrierepruefung
