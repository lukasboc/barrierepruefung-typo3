<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers" data-namespace-typo3-fluid="true">
<f:comment>Rückmeldung der letzten Aktion (PRG), einmal gezeigt. Fehler als role="alert", alles andere als role="status".</f:comment>
<f:if condition="{rueckmeldung.text}">
    <div class="callout {rueckmeldung.klasse}" role="{rueckmeldung.rolle}">
        <div class="callout-icon">
            <span class="icon-emphasized"><core:icon identifier="{rueckmeldung.symbol}" size="small" /></span>
        </div>
        <div class="callout-content">
            <div class="callout-body">
                <p>{rueckmeldung.text}</p>
                <f:if condition="{rueckmeldung.link}"><p><a class="text-decoration-underline" href="{rueckmeldung.link.uri}">{rueckmeldung.link.text}</a></p></f:if>
            </div>
        </div>
    </div>
</f:if>
</html>
