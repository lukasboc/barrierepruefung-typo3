<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:comment>Der Stand als Beschreibungsliste. Jeder Zustand steht als Wort, das badge trägt denselben Text.</f:comment>
<dl class="row">
    <dt class="col-sm-3"><f:translate key="zustand.verbindung" extensionName="Barrierepruefung" /></dt>
    <dd class="col-sm-9">
        <span class="badge badge-success"><f:translate key="wort.verbunden" extensionName="Barrierepruefung" /></span>
        <f:translate key="seit" arguments="{0: stand.verbunden.seit}" extensionName="Barrierepruefung" />
    </dd>

    <dt class="col-sm-3"><f:translate key="zustand.domain" extensionName="Barrierepruefung" /></dt>
    <dd class="col-sm-9">
        <f:if condition="{stand.domain.bestaetigt}">
            <f:then>
                <span class="badge badge-success"><f:translate key="domain.bestaetigt" extensionName="Barrierepruefung" /></span>
                <f:if condition="{stand.domain.am}"><f:translate key="am" arguments="{0: stand.domain.am}" extensionName="Barrierepruefung" /></f:if>
            </f:then>
            <f:else>
                <span class="badge badge-warning"><f:translate key="domain.nicht_bestaetigt" extensionName="Barrierepruefung" /></span>
                <p class="mt-2"><f:translate key="domain.erklaerung" extensionName="Barrierepruefung" /></p>
                <form method="post" action="{f:be.uri(route: 'barrierepruefung_uebersicht.bestaetigen')}" id="barrierepruefung-bestaetigen">
                    <input type="hidden" name="site" value="{site.identifier}">
                    <button type="submit" class="btn btn-default btn-sm"><f:translate key="knopf.bestaetigen" extensionName="Barrierepruefung" /></button>
                </form>
            </f:else>
        </f:if>
        <f:if condition="{stand.domain.pfad}">
            <p class="mt-2"><f:translate key="domain.pfad" arguments="{0: stand.domain.pfad}" extensionName="Barrierepruefung" /></p>
        </f:if>
    </dd>

    <f:if condition="{stand.kontingent}">
        <dt class="col-sm-3"><f:translate key="zustand.kontingent" extensionName="Barrierepruefung" /></dt>
        <dd class="col-sm-9">
            <f:if condition="{stand.kontingent.begrenzt}">
                <f:then><f:translate key="kontingent.begrenzt" arguments="{0: stand.kontingent.genutzt, 1: stand.kontingent.grenze}" extensionName="Barrierepruefung" /></f:then>
                <f:else><f:translate key="kontingent.unbegrenzt" arguments="{0: stand.kontingent.genutzt}" extensionName="Barrierepruefung" /></f:else>
            </f:if>
            <f:if condition="{stand.kontingent.bis}"><f:translate key="kontingent.zeitraum" arguments="{0: stand.kontingent.bis}" extensionName="Barrierepruefung" /></f:if>
        </dd>
    </f:if>

    <f:if condition="{stand.erklaerung}">
        <dt class="col-sm-3"><f:translate key="zustand.letzte" extensionName="Barrierepruefung" /></dt>
        <dd class="col-sm-9">
            <f:if condition="{stand.letzte}">
                <f:then>
                    <span class="badge badge-{stand.letzte.abzeichen}">{stand.letzte.wort}</span>
                    <f:if condition="{stand.letzte.am}"><f:translate key="am" arguments="{0: stand.letzte.am}" extensionName="Barrierepruefung" /></f:if><f:if condition="{stand.letzte.hatBefunde}">, <f:translate key="letzte.befunde" arguments="{0: stand.letzte.befunde}" extensionName="Barrierepruefung" /></f:if>
                    <f:if condition="{stand.letzte.beheben}"><br><a class="text-decoration-underline" href="{f:be.uri(route: 'barrierepruefung_befunde', parameters: {site: site.identifier})}"><f:translate key="letzte.befunde_ansehen" extensionName="Barrierepruefung" /></a></f:if>
                    <f:if condition="{stand.letzte.bericht}"><br><a class="text-decoration-underline" href="{stand.letzte.bericht}"><f:translate key="letzte.bericht" extensionName="Barrierepruefung" /></a></f:if>
                </f:then>
                <f:else><f:translate key="letzte.keine" extensionName="Barrierepruefung" /></f:else>
            </f:if>
        </dd>

        <dt class="col-sm-3"><f:translate key="zustand.erklaerung" extensionName="Barrierepruefung" /></dt>
        <dd class="col-sm-9">
            <f:render partial="ErklaerungStatus" arguments="{erklaerung: stand.erklaerung}" />
            <f:if condition="{stand.erklaerung.fehler}">
                <f:for each="{stand.erklaerung.fehler.saetze}" as="satz"><p class="mt-2 mb-0">{satz}</p></f:for>
                <p class="mt-2 mb-0"><a class="text-decoration-underline" href="{f:be.uri(route: 'barrierepruefung_erklaerung', parameters: {site: site.identifier})}"><f:translate key="erklaerung.zum_untermodul" extensionName="Barrierepruefung" /></a></p>
            </f:if>
        </dd>
    </f:if>
</dl>
</html>
