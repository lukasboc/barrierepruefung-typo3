services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Lubomedia\Barrierepruefung\:
    resource: '../Classes/*'

  # Öffentlich, damit Funktionstests den HTTP-Client über den Container ersetzen können.
  barrierepruefung.guzzle:
    class: GuzzleHttp\Client
    public: true
    factory: ['@TYPO3\CMS\Core\Http\Client\GuzzleClientFactory', 'getClient']

  Lubomedia\Barrierepruefung\Api\Client:
    arguments:
      $http: '@barrierepruefung.guzzle'

  # Der Schlüssel wird bei jeder Auflösung gelesen, nicht beim Übersetzen des Containers.
  Lubomedia\Barrierepruefung\Verbindung\Tresor:
    factory: ['Lubomedia\Barrierepruefung\Verbindung\Tresor', 'ausInstallation']

  Lubomedia\Barrierepruefung\Verbindung\Verbinden:
    public: true

  Lubomedia\Barrierepruefung\Verbindung\Verbindungen:
    public: true

  Lubomedia\Barrierepruefung\Verbindung\Verifikation:
    public: true

  Lubomedia\Barrierepruefung\Erklaerung\Abruf:
    public: true

  # Öffentlich: TypoScript nennt den Processor beim Klassennamen, und der Kern sucht ihn im Container.
  Lubomedia\Barrierepruefung\DataProcessing\ErklaerungProcessor:
    public: true
