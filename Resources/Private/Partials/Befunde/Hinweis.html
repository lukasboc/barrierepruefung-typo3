<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers" data-namespace-typo3-fluid="true">
<f:comment>Ein Satz im callout und der Weg zur Übersicht, wo verbunden wird.</f:comment>
<div class="callout {klasse}" role="status">
    <div class="callout-icon"><span class="icon-emphasized"><core:icon identifier="{symbol}" size="small" /></span></div>
    <div class="callout-content"><div class="callout-body"><p><f:translate key="{textSchluessel}" extensionName="Barrierepruefung" /></p></div></div>
</div>
<p><a class="btn btn-default" href="{uebersichtUri}"><f:translate key="befunde.zur_uebersicht" extensionName="Barrierepruefung" /></a></p>
</html>
